    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, updateDoc, doc, setDoc, getDoc, deleteDoc, arrayUnion, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnF-e8BYtHKkqMGKLPL6-tCzh9SZHwGIE",
            authDomain: "my-social-app-74cb5.firebaseapp.com",
            projectId: "my-social-app-74cb5",
            storageBucket: "my-social-app-74cb5.firebasestorage.app",
            messagingSenderId: "296934453383",
            appId: "1:296934453383:web:c5135ba3c923e20c788822"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence).catch((error) => console.error(error));

        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const defaultImg = "https://www.gravatar.com/avatar/?d=mp";

        let currentUserProfile = null;
        let allUsersCache = [];
        let pinnedUsers = JSON.parse(localStorage.getItem('pinned_users') || '[]'); // 記錄置頂用戶 UID
        let replyingTo = null; // 當前回覆的訊息內容

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);
                let nameVal = user.displayName || "使用者";
                let usernameVal = user.email ? user.email.split('@')[0] : "user_" + user.uid.substring(0, 5);
                let photoVal = user.photoURL || defaultImg;
                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    if (data.username && data.username !== "undefined") usernameVal = data.username;
                    if (data.photo) photoVal = data.photo;
                }
                currentUserProfile = { uid: user.uid, name: nameVal, username: usernameVal, photo: photoVal };
                await setDoc(userDocRef, currentUserProfile, { merge: true });

                document.getElementById("myAvatar").src = currentUserProfile.photo;
                document.getElementById("myName").innerText = currentUserProfile.name;
                document.getElementById("myUsername").innerText = `@${currentUserProfile.username}`;

                document.getElementById("loginSection").style.display = "none";
                document.getElementById("appSection").style.display = "block";
                loadPosts();
                loadUserList();
            } else {
                document.getElementById("loginSection").style.display = "block";
                document.getElementById("appSection").style.display = "none";
            }
        });

        document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
        document.getElementById("logoutBtn").onclick = () => signOut(auth);

        const homeView = document.getElementById("homeView");
        const chatView = document.getElementById("chatView");
        const navHome = document.getElementById("navHome");
        const navChat = document.getElementById("navChat");
        const userProfileBanner = document.getElementById("userProfileBanner");
        const unreadBadge = document.getElementById("unreadBadge");

        navHome.onclick = () => {
            homeView.style.display = "block";
            chatView.style.display = "none";
            userProfileBanner.style.display = "flex";
            navHome.classList.add("active");
            navChat.classList.remove("active");
        };

        navChat.onclick = () => {
            homeView.style.display = "none";
            chatView.style.display = "block";
            userProfileBanner.style.display = "none";
            navChat.classList.add("active");
            navHome.classList.remove("active");
            unreadBadge.style.display = "none";
        };

        document.getElementById("postBtn").onclick = async () => {
            const text = document.getElementById("postInput").value;
            if (!text.trim()) return;
            await addDoc(collection(db, "memos"), { 
                content: text, 
                name: currentUserProfile.name, 
                username: currentUserProfile.username,
                uid: currentUserProfile.uid, 
                timestamp: new Date(), 
                likedBy: [] 
            });
            document.getElementById("postInput").value = "";
        };

        function loadPosts() {
            onSnapshot(query(collection(db, "memos"), orderBy("timestamp", "desc")), (snapshot) => {
                const list = document.getElementById("memoList");
                list.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const likedBy = data.likedBy || [];
                    const isLiked = likedBy.some(user => user.uid === auth.currentUser.uid);
                    const isOwner = auth.currentUser.uid === data.uid;
                    
                    const postName = (data.name && data.name !== "看社交" && data.name !== "undefined") ? data.name : "使用者";
                    const postUsername = (data.username && data.username !== "undefined") ? data.username : "user";

                    const avatarHtml = likedBy.map(user => {
                        const imgSrc = user.photo ? user.photo : defaultImg;
                        return `<img src="${imgSrc}" style="width:24px; height:24px; border-radius:50%; margin-right:4px; object-fit:cover;">`;
                    }).join('');

                    const div = document.createElement("div");
                    div.className = "post";
                    div.innerHTML = `
                        <strong>${postName}</strong> <span style="color:#8e8e8e; font-size:13px;">@${postUsername}</span>
                        <p style="margin: 10px 0;">${data.content}</p>
                        <div style="display:flex; align-items:center; gap:5px; margin-bottom:5px;">
                            <button id="like-${docSnap.id}" style="background:none; border:none; font-size:20px; cursor:pointer;" class="${isLiked ? 'liked' : ''}">❤️</button>
                            <span>${likedBy.length} 個讚</span>
                        </div>
                        <div style="display:flex; align-items:center; flex-wrap:wrap; font-size:12px; color:#666;">${avatarHtml} 覺得很讚</div>
                        ${isOwner ? `<button id="del-${docSnap.id}" style="background:none; border:none; color:#ed4956; cursor:pointer; margin-top:10px;">刪除貼文</button>` : ''}
                    `;
                    list.appendChild(div);

                    document.getElementById(`like-${docSnap.id}`).onclick = async () => {
                        if (isLiked) return;
                        await updateDoc(doc(db, 'memos', docSnap.id), { 
                            likedBy: arrayUnion({ uid: auth.currentUser.uid, photo: currentUserProfile.photo })
                        });
                    };

                    if (isOwner) {
                        document.getElementById(`del-${docSnap.id}`).onclick = () => deleteDoc(doc(db, 'memos', docSnap.id));
                    }
                });
            });
        }

        async function loadUserList() {
            const querySnapshot = await getDocs(collection(db, "users"));
            allUsersCache = [];
            querySnapshot.forEach(docSnap => {
                const uData = docSnap.data();
                if (uData.uid && uData.uid !== auth.currentUser.uid) {
                    const targetUser = {
                        uid: uData.uid,
                        name: (uData.name && uData.name !== "看社交" && uData.name !== "undefined") ? uData.name : "使用者",
                        username: (uData.username && uData.username !== "undefined") ? uData.username : "user",
                        photo: uData.photo || defaultImg
                    };
                    allUsersCache.push(targetUser);

                    const chatId = [auth.currentUser.uid, targetUser.uid].sort().join("_");
                    let isFirstSnapshot = true;
                    onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "desc")), (snapshot) => {
                        if (!snapshot.empty) {
                            const latestMsg = snapshot.docs[0].data();
                            if (!isFirstSnapshot && latestMsg.sender !== auth.currentUser.uid) {
                                unreadStatus[targetUser.uid] = true;
                                document.getElementById("unreadBadge").style.display = "block";
                                const dot = document.getElementById(`dot-${targetUser.uid}`);
                                if (dot) dot.style.display = "block";
                            }
                        }
                        isFirstSnapshot = false;
                    });
                }
            });
            renderUserList(allUsersCache);
        }

        const unreadStatus = {};

        function renderUserList(users) {
            const targetUsersDiv = document.getElementById("targetUsers");
            targetUsersDiv.innerHTML = "";
            if (users.length === 0) {
                targetUsersDiv.innerHTML = `<p style="color:#888;">目前沒有其他使用者。</p>`;
                return;
            }

            // 排序：置頂的排在前面
            users.sort((a, b) => {
                const aPinned = pinnedUsers.includes(a.uid);
                const bPinned = pinnedUsers.includes(b.uid);
                return bPinned - aPinned;
            });

            users.forEach(uData => {
                const hasUnread = unreadStatus[uData.uid] || false;
                const isPinned = pinnedUsers.includes(uData.uid);

                const userItem = document.createElement("div");
                userItem.className = "user-list-item";
                userItem.innerHTML = `
                    <div class="user-info-area">
                        <div class="user-unread-dot" id="dot-${uData.uid}" style="display: ${hasUnread ? 'block' : 'none'};"></div>
                        <img src="${uData.photo}">
                        <div>
                            <strong>${uData.name}</strong> ${isPinned ? '<span style="color:#0095f6; font-size:12px;">📌 置頂</span>' : ''}
                            <div style="color:#8e8e8e; font-size:12px;">@${uData.username}</div>
                        </div>
                    </div>
                    <div class="menu-container">
                        <button class="menu-btn" id="menu-btn-${uData.uid}">⋮</button>
                        <div class="dropdown-menu" id="dropdown-${uData.uid}">
                            <button class="dropdown-item" id="pin-${uData.uid}">${isPinned ? '取消置頂' : '置頂對話'}</button>
                            <button class="dropdown-item danger" id="del-chat-${uData.uid}">刪除對話</button>
                        </div>
                    </div>
                `;

                // 點擊主體進入聊天室
                userItem.querySelector(".user-info-area").onclick = () => {
                    unreadStatus[uData.uid] = false;
                    document.getElementById(`dot-${uData.uid}`).style.display = "none";
                    openChatRoom(uData.uid, uData.name, uData.username);
                };

                // 三個點選單開關
                const menuBtn = userItem.querySelector(`#menu-btn-${uData.uid}`);
                const dropdown = userItem.querySelector(`#dropdown-${uData.uid}`);
                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    // 關閉其他選單
                    document.querySelectorAll('.dropdown-menu').forEach(m => { if(m !== dropdown) m.style.display = 'none'; });
                    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
                };

                // 置頂按鈕
                userItem.querySelector(`#pin-${uData.uid}`).onclick = (e) => {
                    e.stopPropagation();
                    dropdown.style.display = 'none';
                    if (isPinned) {
                        pinnedUsers = pinnedUsers.filter(id => id !== uData.uid);
                    } else {
                        pinnedUsers.push(uData.uid);
                    }
                    localStorage.setItem('pinned_users', JSON.stringify(pinnedUsers));
                    renderUserList(allUsersCache);
                };

                // 刪除對話按鈕
                userItem.querySelector(`#del-chat-${uData.uid}`).onclick = async (e) => {
                    e.stopPropagation();
                    dropdown.style.display = 'none';
                    if(!confirm(`確定要刪除與 ${uData.name} 的所有對話嗎？`)) return;
                    const chatId = [auth.currentUser.uid, uData.uid].sort().join("_");
                    const snap = await getDocs(collection(db, "chats", chatId, "messages"));
                    const batch = writeBatch(db);
                    snap.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    alert("對話已刪除");
                };

                targetUsersDiv.appendChild(userItem);
            });
        }

        // 點擊其他地方關閉選單
        window.onclick = () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        };

        document.getElementById("searchBtn").onclick = () => {
            const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
            if (!keyword) {
                renderUserList(allUsersCache);
                return;
            }
            const filtered = allUsersCache.filter(u => u.username.toLowerCase().includes(keyword));
            renderUserList(filtered);
        };

        function openChatRoom(targetUid, targetName, targetUsername) {
            document.getElementById("chatUserList").style.display = "none";
            document.getElementById("activeChatRoom").style.display = "block";
            document.getElementById("chatWithTitle").innerText = `與 ${targetName} (@${targetUsername}) 的聊天室`;

            const chatId = [auth.currentUser.uid, targetUid].sort().join("_");
            const messagesRef = collection(db, "chats", chatId, "messages");

            onSnapshot(query(messagesRef, orderBy("timestamp", "asc")), (snapshot) => {
                const msgContainer = document.getElementById("chatMessages");
                msgContainer.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    const isMe = msg.sender === auth.currentUser.uid;
                    
                    const msgWrapper = document.createElement("div");
                    msgWrapper.className = `message-container ${isMe ? 'message-me' : 'message-other'}`;

                    let replyHtml = '';
                    if (msg.replyTo) {
                        replyHtml = `<div class="reply-quote">回覆：${msg.replyTo}</div>`;
                    }

                    msgWrapper.innerHTML = `
                        <div class="message-bubble">
                            ${replyHtml}
                            <div>${msg.content}</div>
                        </div>
                    `;

                    // 點擊訊息即可「回覆」該則訊息
                    msgWrapper.querySelector(".message-bubble").onclick = () => {
                        replyingTo = msg.content;
                        document.getElementById("replyPreviewText").innerText = `回覆：${msg.content}`;
                        document.getElementById("replyPreviewBar").style.display = "flex";
                        document.getElementById("chatInput").focus();
                    };

                    msgContainer.appendChild(msgWrapper);
                });
                msgContainer.scrollTop = msgContainer.scrollHeight;
            });

            // 取消回覆
            document.getElementById("cancelReplyBtn").onclick = () => {
                replyingTo = null;
                document.getElementById("replyPreviewBar").style.display = "none";
            };

            const chatInput = document.getElementById("chatInput");
            chatInput.onkeypress = (e) => { 
                if(e.key === 'Enter') document.getElementById("sendChatBtn").click(); 
            };

            document.getElementById("sendChatBtn").onclick = async () => {
                const text = chatInput.value;
                if (!text.trim()) return;

                const newMsg = {
                    content: text,
                    sender: auth.currentUser.uid,
                    timestamp: new Date()
                };
                if (replyingTo) {
                    newMsg.replyTo = replyingTo;
                }

                await addDoc(messagesRef, newMsg);
                chatInput.value = "";
                replyingTo = null;
                document.getElementById("replyPreviewBar").style.display = "none";
            };
        }

        document.getElementById("backToList").onclick = () => {
            document.getElementById("activeChatRoom").style.display = "none";
            document.getElementById("chatUserList").style.display = "block";
            renderUserList(allUsersCache);
        };
    </script>
